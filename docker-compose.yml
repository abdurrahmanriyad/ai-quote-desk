services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: quote
      POSTGRES_PASSWORD: quote
      POSTGRES_DB: quote_desk
    ports:
      - '54329:5432'
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quote -d quote_desk']
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--maxmemory-policy', 'noeviction']
    ports:
      - '63799:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres:
